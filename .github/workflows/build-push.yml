name: Build and Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Free ~30 GB by removing pre-installed tools we don't need
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Two names on purpose, for now. wanly-gpu-docker matches the repo and the RunPod
          # template; wanly22-runpod is the legacy name and stays published because Docker Hub
          # cannot rename a repository, so anything still pointing at it -- a saved pod spec, a
          # template not in our list -- would simply fail to pull. That failure reads as a RunPod
          # capacity problem, not a naming one, which is an expensive hour to spend. Cheap to keep
          # publishing both. Drop the legacy pair once nothing has pulled it for a while (#36).
          tags: |
            davidjbarnes/wanly-gpu-docker:latest
            davidjbarnes/wanly-gpu-docker:${{ github.sha }}
            davidjbarnes/wanly22-runpod:latest
            davidjbarnes/wanly22-runpod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
