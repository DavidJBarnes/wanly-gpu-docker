name: Build and Push Docker Image

on:
  push:
    branches: [main, next]

# ONE BUILD AT A TIME. The tags are moving pointers; two overlapping runs would leave
# whichever finished last as :latest regardless of which commit it was.
concurrency:
  group: build-push
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Free ~30 GB by removing pre-installed tools we don't need
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The `next` branch publishes :next only, so the 3090 can run a change before main
      # moves and RunPod (which pulls :latest) never sees it (wanly-gpu-docker#83).
      - name: Tags for this branch
        id: tags
        run: |
          if [ "${GITHUB_REF_NAME}" = "next" ]; then
            echo "tags=davidjbarnes/wanly-gpu-docker:next,davidjbarnes/wanly-gpu-docker:next-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "full=davidjbarnes/wanly-gpu-docker:next-full,davidjbarnes/wanly-gpu-docker:next-full-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=davidjbarnes/wanly-gpu-docker:latest,davidjbarnes/wanly-gpu-docker:${GITHUB_SHA},davidjbarnes/wanly22-runpod:latest,davidjbarnes/wanly22-runpod:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "full=davidjbarnes/wanly-gpu-docker:full,davidjbarnes/wanly-gpu-docker:full-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Two names on purpose, for now. wanly-gpu-docker matches the repo and the RunPod
          # template; wanly22-runpod is the legacy name and stays published because Docker Hub
          # cannot rename a repository, so anything still pointing at it -- a saved pod spec, a
          # template not in our list -- would simply fail to pull. That failure reads as a RunPod
          # capacity problem, not a naming one, which is an expensive hour to spend. Cheap to keep
          # publishing both. Drop the legacy pair once nothing has pulled it for a while (#36).
          tags: ${{ steps.tags.outputs.tags }}
          # Without this the image reports GIT_SHA=unknown, which is what every build
          # before #72 did -- start.sh has printed "image build: unknown" on every boot since
          # the line was added, and the daemon now reports the same value upstream so two
          # workers on different images can be told apart.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The :full tag (wanly-gpu-docker#83): the same Dockerfile with the trainer and
      # image-description layer. Built SECOND so the lean layers come from cache and only the
      # ~7 GB payload is new work; the runner's disk was freed above. RunPod never pulls this.
      - name: Free disk space again before the full build
        run: |
          sudo docker image prune -af
          df -h /

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.full }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            WITH_TRAINER=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
